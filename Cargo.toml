[package]
name = "souba"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
thiserror = "2"
chrono = "0.4"
chrono-tz = "0.10"
rust_decimal = "1"
encoding_rs = "0.8"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
ratatui = "0.30"
crossterm = "0.29"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
] }

[profile.release]
lto = true
strip = true
